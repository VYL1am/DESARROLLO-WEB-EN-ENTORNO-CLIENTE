<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Memory</title>

    <style>
        .galeria {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 900px;
            margin: 30px auto;
        }

        .galeria img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <button type="button" id="btnInicio">Crea Rejilla Memory</button>
    <div class="galeria"></div>
    <script src="scriptMemory.js"></script>
</body>

</html>
