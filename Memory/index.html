<html lang="es">

<head>
    <title>Galería de 6 imágenes</title>
    <style>
        .galeria {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 900px;
            margin: 30px auto;
        }

        .galeria img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="galeria"> <!-- cambio necesario -->
        <img src="imagenes/reversoCarta.png" alt="Imagen 1">
        <img src="imagenes/reversoCarta.png" alt="Imagen 2">
        <img src="imagenes/reversoCarta.png" alt="Imagen 3">
        <img src="imagenes/reversoCarta.png" alt="Imagen 4">
        <img src="imagenes/reversoCarta.png" alt="Imagen 5">
        <img src="imagenes/reversoCarta.png" alt="Imagen 6">
    </div>
    <script src="script.js"></script> <!-- necesario para ejecutar el script -->
</body>

</html>
